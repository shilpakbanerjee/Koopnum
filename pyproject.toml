[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koopman-toolkit"
version = "0.1.0"
description = "A lightweight research-oriented Python toolkit for Koopman-operator approximations"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "OpenAI"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7"
]

[tool.setuptools]
packages = ["koopman_toolkit"]
